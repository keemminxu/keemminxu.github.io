<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'ko' }}">
  {%- include head.html -%}
  <body class="layout-{{ page.layout | default: 'page' }}{% if page.url == '/' %} is-home{% endif %}{% if page.url == '/daily/' %} is-daily{% endif %}">
    {%- include header.html -%}

    <div class="site-container">
      <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>
      {%- include sidebar-left.html -%}

      <main class="main-content">
        {{ content }}
      </main>
    </div>

    {%- include footer.html -%}
    {%- include admin-editor.html -%}
  </body>
</html>
